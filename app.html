<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Миний хуудас — NEXUS</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/pages.css" />
</head>
<body data-page="app">
  <div class="dash">
    <!-- Хажуугийн цэс -->
    <aside class="dash-sidebar" id="sidebar">
      <a class="logo" href="./index.html"><img src="./assets/logo-nexus.png" alt="NEXUS" /></a>
      <button class="side-link" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        Нүүр хуудас
      </button>
      <button class="side-link" data-route="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-3.5 4.2-5 7.5-5s6 1.5 7.5 5"/></svg>
        Миний профайл
      </button>
      <button class="side-link" data-route="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V9H8"/><path d="M12 7.5V12l3 2"/></svg>
        Тестийн түүх
      </button>
      <button class="side-link" data-route="exercises">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6"/></svg>
        Дасгалууд
      </button>
      <button class="side-link" data-route="ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3.2A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14.5h4"/></svg>
        AI чиглүүлэгч
      </button>
      <button class="side-link" data-route="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7.5" y="12" width="3" height="5" rx="0.6"/><rect x="12.5" y="8" width="3" height="9" rx="0.6"/><rect x="17" y="5.5" width="3" height="11.5" rx="0.6"/></svg>
        Ахицын тайлан
      </button>
      <button class="side-link" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        Тохиргоо
      </button>
      <div class="side-foot">NEXUS © 2026<br />«Бод. Холбоосыг ол. Ахиц гарга.»</div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop"></div>

    <!-- Гол хэсэг -->
    <div class="dash-main">
      <header class="dash-topbar">
        <button class="top-link dash-menu-btn" id="menuBtn" aria-label="Цэс">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        </button>
        <button class="top-link" data-route="home">Нүүр</button>
        <button class="top-link" data-route="history">Тест</button>
        <button class="top-link" data-route="exercises">Дасгал</button>
        <button class="top-link" data-route="progress">Ахиц</button>
        <button class="top-link" data-route="settings">Тохиргоо</button>
        <button class="user-chip" data-route="profile" id="userChip">
          <span class="who"><span class="hi">Сайн байна уу,</span><span class="nm" id="userName">...</span></span>
          <span class="avatar" id="userAvatar">N</span>
        </button>
      </header>
      <main class="dash-content" id="viewRoot"></main>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="./src/pages/dashboard.js"></script>
</body>
</html>
