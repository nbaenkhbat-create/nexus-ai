<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нэвтрэх — NEXUS</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/pages.css" />
</head>
<body data-page="login">
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="./index.html"><img src="./assets/logo-nexus.png" alt="NEXUS" /></a>
      <nav class="main-nav">
        <a href="./index.html">Нүүр</a>
        <a href="./test.html">Үнэгүй тест</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-primary btn-sm" href="./signup.html">Бүртгүүлэх</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div>
      <div class="card auth-card">
        <a class="logo" href="./index.html"><img src="./assets/logo-nexus.png" alt="NEXUS" /></a>
        <h1>Тавтай морилно уу</h1>
        <p class="sub">NEXUS бүртгэлтэй хэрэглэгчээрээ нэвтэрнэ үү</p>

        <div id="setupNotice" class="hidden"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Имэйл</label>
            <input id="email" type="email" autocomplete="email" placeholder="tailan@жишээ.mn" required />
          </div>
          <div class="field">
            <label for="password">Нууц үг</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <div id="formError" class="form-error hidden"></div>
          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Нэвтрэх →</button>
        </form>

        <div class="divider">эсвэл</div>

        <button class="oauth-btn" id="googleBtn" type="button">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.6 12.2c0-.7-.06-1.4-.18-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"/></svg>
          Google-ээр нэвтрэх
        </button>

        <p class="auth-alt"><a href="./reset.html">Нууц үгээ мартсан уу?</a></p>
        <p class="auth-alt">Бүртгэлгүй юу? <a href="./signup.html">Бүртгүүлэх</a></p>
      </div>
      <p class="center small muted" style="margin-top: 18px;">
        Бүртгэлгүйгээр <a href="./test.html" style="color: var(--blue);">15 асуулттай үнэгүй тест</a> өгөх боломжтой.
      </p>
    </div>
  </main>

  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="./src/pages/auth.js"></script>
</body>
</html>
